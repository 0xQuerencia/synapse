name: PostgreSQL testnet qualification
on:
  pull_request:
    paths: ['community/**', '.github/workflows/postgres-testnet.yml']
  push:
    branches: [main]
    paths: ['community/**', '.github/workflows/postgres-testnet.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-testnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable-ci-admin
          POSTGRES_DB: synapse_testnet
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d synapse_testnet"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SYNAPSE_TEST_POSTGRES_DSN: postgresql://synapse_test:disposable-ci-role@127.0.0.1:5432/synapse_testnet
      PYTHONPATH: community
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies into a private virtual environment
        run: |
          python3 -m venv "$RUNNER_TEMP/synapse-pg"
          "$RUNNER_TEMP/synapse-pg/bin/python" -m pip install -r community/requirements-postgres.txt
      - name: Provision restricted disposable test role
        run: |
          "$RUNNER_TEMP/synapse-pg/bin/python" - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://postgres:disposable-ci-admin@127.0.0.1:5432/synapse_testnet') as db:
              db.execute("CREATE ROLE synapse_test LOGIN PASSWORD 'disposable-ci-role' NOSUPERUSER NOCREATEDB NOCREATEROLE")
              db.execute('REVOKE CREATE ON SCHEMA public FROM PUBLIC')
              db.execute('GRANT CONNECT, CREATE ON DATABASE synapse_testnet TO synapse_test')
          PY
      - name: Exercise real PostgreSQL transactions, concurrency and recovery
        run: |
          "$RUNNER_TEMP/synapse-pg/bin/python" -m unittest discover -s community/tests -p test_postgres.py -v
