name: Community testnet checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-testnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned testnet dependencies in an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/synapse-community-venv"
          "$RUNNER_TEMP/synapse-community-venv/bin/python" -m pip install --disable-pip-version-check -r community/requirements.txt
      - name: Run synthetic ledger, process, artifact and release-gate tests
        run: |
          export PATH="$RUNNER_TEMP/synapse-community-venv/bin:$PATH"
          sh community/verify.sh
      - name: Assert production release remains blocked
        run: |
          set +e
          "$RUNNER_TEMP/synapse-community-venv/bin/python" community/tools/release_gate.py --assert-release
          status=$?
          set -e
          test "$status" -eq 1
